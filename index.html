    <meta property="og:title" content="SIMAG PLN - Sistem Manajemen Gudang & Stok kWh Meter" />
    <meta property="og:description" content="Sistem pendataan stok material kWh meter PLN real-time dengan visualisasi rak gudang, scanner barcode karton, pencatatan pasang baru/ganti meter, notifikasi stok minimum, dan sinkronisasi Google Sheets." />

    <script>
      (function () {
        try {
          var saved = localStorage.getItem('pln_warehouse_theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased selection:bg-cyan-500 selection:text-white min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
